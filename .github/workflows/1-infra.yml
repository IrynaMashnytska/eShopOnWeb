name: 1 - Deploy Infrastructure (Bicep)

on:
  push:
    branches: [ master ]
    paths:
      - 'infra/**'          
  workflow_dispatch:         
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options: [ dev, staging, prod ]

env:
  LOCATION: eastus
  PROJECT_NAME: eshop

jobs:
  validate:
    name: ✅ Validate Bicep
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Lint Bicep files
      run: |
        echo "Linting main.bicep..."
        az bicep lint --file infra/main.bicep
        echo "✅ Lint passed"

    - name: 🔍 Validate template
      run: |
        az deployment sub validate \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \
          --query '{State:properties.provisioningState}' \
          --output json
        echo "✅ Validation passed"

    - name: 🔍 What-If Preview
      run: |
        az deployment sub what-if \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \

  deploy:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate             
    environment: infrastructure  

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy Bicep
      id: bicep_deploy
      run: |
        # Create unique deployment name with timestamp
        DEPLOY_NAME="eshop-infra-$(date +%Y%m%d-%H%M%S)"
        echo "deploy_name=$DEPLOY_NAME" >> $GITHUB_OUTPUT

        az deployment sub create \
          --name "$DEPLOY_NAME" \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \

        echo "✅ Infrastructure deployed!"

    - name: 📋 Show Deployment Results
      run: |
        echo "## 🏗️ Infrastructure Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY

        OUTPUTS='${{ steps.bicep_deploy.outputs.outputs }}'

        WEB_EUS=$(echo $OUTPUTS | jq -r '.webEastUS.production')
        STAGING=$(echo $OUTPUTS | jq -r '.webEastUS.staging')
        WEB_WEU=$(echo $OUTPUTS | jq -r '.webWestEU.production')
        API_URL=$(echo $OUTPUTS | jq -r '.publicApi.url')
        TM_URL=$(echo $OUTPUTS  | jq -r '.trafficManager.url')

        echo "| 🌎 Web East US | $WEB_EUS |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔵 Staging Slot | $STAGING |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌍 Web West EU | $WEB_WEU |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔌 Public API | $API_URL |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚦 Traffic Mgr | $TM_URL |" >> $GITHUB_STEP_SUMMARY

    - name: 💾 Save URLs as Artifact
      run: |
        mkdir -p deployment-info
        echo '${{ steps.bicep_deploy.outputs.outputs }}' \
          > deployment-info/urls.json
        cat deployment-info/urls.json

    - uses: actions/upload-artifact@v4
      with:
        name: deployment-urls
        path: deployment-info/
        retention-days: 30