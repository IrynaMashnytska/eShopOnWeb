name: 1 - Deploy Infrastructure (Bicep)

on:
  push:
    branches: [ master ]
    paths:
      - 'infra/**'          
  workflow_dispatch:         

env:
  LOCATION: westeurope
  PROJECT_NAME: eshop
  ENVIRONMENT: prod

jobs:
  validate:
    name: ✅ Validate Bicep
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Lint Bicep files
      run: |
        echo "Linting main.bicep..."
        az bicep lint --file infra/main.bicep
        echo "✅ Lint passed"

    - name: 🔍 Validate template
      run: |
        az deployment sub validate \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \
          --parameters environment=${{ env.ENVIRONMENT }} \
          --query '{State:properties.provisioningState}' \
          --output json
        echo "✅ Validation passed"

    - name: 🔍 What-If Preview
      run: |
        az deployment sub what-if \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \
          --parameters environment=${{ env.ENVIRONMENT }}

  deploy:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate             
    environment: infrastructure  

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy Bicep
      id: bicep_deploy
      run: |
        # Create unique deployment name with timestamp
        DEPLOY_NAME="eshop-infra-$(date +%Y%m%d-%H%M%S)"
        echo "deploy_name=$DEPLOY_NAME" >> $GITHUB_OUTPUT

        az deployment sub create \
          --name "$DEPLOY_NAME" \
          --location ${{ env.LOCATION }} \
          --template-file infra/main.bicep \
          --parameters infra/main.bicepparam \
          --parameters environment=${{ env.ENVIRONMENT }}

        echo "✅ Infrastructure deployed!"

    - name: 📋 Show Deployment Results
      run: |
        echo "## 🏗️ Infrastructure Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Resource | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY

        SUMMARY=$(az deployment sub show \
          --name "${{ steps.bicep_deploy.outputs.deploy_name }}" \
          --query properties.outputs.summary.value --output json)
        echo "$SUMMARY" > summary.json

        echo "| 🌐 Web | $(jq -r '.web' summary.json) |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔌 Public API | $(jq -r '.publicApi' summary.json) |" >> $GITHUB_STEP_SUMMARY
        echo "| ⚡ Function (OrderItemsReserver) | $(jq -r '.functionApp' summary.json) |" >> $GITHUB_STEP_SUMMARY
        echo "| 🗄️ Storage account | $(jq -r '.storageAccount' summary.json) / $(jq -r '.ordersContainer' summary.json) |" >> $GITHUB_STEP_SUMMARY

    - name: 💾 Save URLs as Artifact
      run: |
        mkdir -p deployment-info
        mv summary.json deployment-info/urls.json
        cat deployment-info/urls.json

    - uses: actions/upload-artifact@v4
      with:
        name: deployment-urls
        path: deployment-info/
        retention-days: 30