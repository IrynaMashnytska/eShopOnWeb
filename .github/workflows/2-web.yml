name: 2 - Deploy Web App

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Web/**'
      - 'src/ApplicationCore/**'
      - 'src/Infrastructure/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/Web/Web.csproj'
  TEST_PATH: 'tests/UnitTests/UnitTests.csproj'
  RESOURCE_GROUP: rg-eshop-prod

jobs:
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore packages
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: 🏗️ Build
      run: |
        dotnet build ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-restore

    - name: 🧪 Run Tests
      run: |
        dotnet test ${{ env.TEST_PATH }} \
          --configuration Release \
          --verbosity normal

    - name: 📤 Publish App
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ./publish

    - name: 💾 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-build-${{ github.sha }}
        path: ./publish
        retention-days: 1

  deploy:
    name: 🚀 Deploy Web App
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.get_app.outputs.web_url }}

    steps:
    - name: 📥 Download artifact
      uses: actions/download-artifact@v4
      with:
        name: web-app-build-${{ github.sha }}
        path: ./publish

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Get App Name
      id: get_app
      run: |
        APP_NAME=$(az webapp list \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?starts_with(name,'web-eshop')].name" \
          --output tsv)
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "web_url=https://${APP_NAME}.azurewebsites.net" >> $GITHUB_OUTPUT
        echo "Deploying to: $APP_NAME"

    - name: 🚀 Deploy Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ steps.get_app.outputs.app_name }}
        package: ./publish

    - name: 🔍 Health Check
      run: |
        URL="${{ steps.get_app.outputs.web_url }}"

        sleep 20

        for i in {1..5}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 --location "$URL")

          if [[ "$STATUS" == "200" ]] || [[ "$STATUS" == "302" ]]; then
            echo "✅ Web app healthy: $URL"
            exit 0
          fi
          echo "Attempt $i failed ($STATUS), retrying..."
          sleep 15
        done

        echo "❌ Health check failed!"
        exit 1

    - name: 📝 Summary
      if: success()
      run: |
        echo "## ✅ Web App Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** ${{ steps.get_app.outputs.web_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
