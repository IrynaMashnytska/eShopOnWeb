name: 3 - Deploy OrderItemsReserver Function

on:
  push:
    branches: [ master ]
    paths:
      - 'Azure.Functions.Worker/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'Azure.Functions.Worker/OrderItemsReserver.csproj'
  RESOURCE_GROUP: rg-eshop-prod

jobs:
  build:
    name: 🔨 Build Function
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📤 Publish Function
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --output ./publish

    - name: 💾 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: function-build-${{ github.sha }}
        path: ./publish
        retention-days: 1

  deploy:
    name: 🚀 Deploy Function
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.get_app.outputs.func_url }}

    steps:
    - name: 📥 Download artifact
      uses: actions/download-artifact@v4
      with:
        name: function-build-${{ github.sha }}
        path: ./publish

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Get Function App Name
      id: get_app
      run: |
        APP_NAME=$(az functionapp list \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[?starts_with(name,'func-eshop')].name" \
          --output tsv)
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "func_url=https://${APP_NAME}.azurewebsites.net/api/OrderItemsReserver" >> $GITHUB_OUTPUT
        echo "Deploying to: $APP_NAME"

    - name: 🚀 Deploy Function
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ steps.get_app.outputs.app_name }}
        package: ./publish

    # An empty POST is rejected with 400 before any blob is written; 404 means the function is not registered.
    - name: 🔍 Health Check
      run: |
        URL="${{ steps.get_app.outputs.func_url }}"

        sleep 20

        for i in {1..6}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 -X POST \
            -H "Content-Type: application/json" -d '{}' "$URL")

          if [[ "$STATUS" == "400" ]]; then
            echo "✅ Function is live: $URL"
            exit 0
          fi
          echo "Attempt $i: Status $STATUS, retrying..."
          sleep 15
        done

        echo "❌ Function health check failed!"
        exit 1

    - name: 📝 Summary
      if: success()
      run: |
        echo "## ✅ OrderItemsReserver Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Endpoint:** ${{ steps.get_app.outputs.func_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
