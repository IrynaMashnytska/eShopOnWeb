name: 4 - Deploy Public API

on:
  push:
    branches: [ master ]
    paths:
      - 'src/PublicApi/**'
      - 'src/Core/**'
      - 'src/Infrastructure/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  API_PROJECT_PATH: 'src/PublicApi/PublicApi.csproj'

jobs:
  build:
    name: 🔨 Build API
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build & Publish API
      run: |
        dotnet restore ${{ env.API_PROJECT_PATH }}
        dotnet build ${{ env.API_PROJECT_PATH }} \
          --configuration Release \
          --no-restore
        dotnet publish ${{ env.API_PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ./publish

    - uses: actions/upload-artifact@v4
      with:
        name: api-build-${{ github.sha }}
        path: ./publish
        retention-days: 1

  deploy:
    name: 🔌 Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production-westeu
      url: ${{ steps.get_app.outputs.api_url }}

    steps:
    - name: 📥 Download artifact
      uses: actions/download-artifact@v4
      with:
        name: api-build-${{ github.sha }}
        path: ./publish

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Get API App Name
      id: get_app
      run: |
        APP_NAME=$(az webapp list \
          --resource-group rg-eshop-weu-prod \
          --query "[?contains(name,'api-eshop')].name" \
          --output tsv)

        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "api_url=https://${APP_NAME}.azurewebsites.net" >> $GITHUB_OUTPUT
        echo "Deploying API to: $APP_NAME"

    - name: 🚀 Deploy API
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ steps.get_app.outputs.app_name }}
        package: ./publish

    - name: 🔍 API Health Check
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        URL="https://${APP_NAME}.azurewebsites.net/api/catalog-items"

        sleep 20

        for i in {1..5}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 "$URL")

          if [[ "$STATUS" == "200" ]]; then
            echo "✅ API healthy: $URL"
            exit 0
          fi
          echo "Attempt $i: Status $STATUS, retrying..."
          sleep 15
        done

        echo "❌ API health check failed!"
        exit 1

    - name: 🔍 Verify Autoscale Active
      run: |
        AUTOSCALE=$(az monitor autoscale list \
          --resource-group rg-eshop-weu-prod \
          --query "[?contains(name,'autoscale')].{Name:name,Enabled:enabled}" \
          --output table)
        echo "Autoscale status:"
        echo "$AUTOSCALE"

    - name: 📝 Summary
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        echo "## ✅ Public API Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**API URL:** https://${APP_NAME}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
        echo "**Swagger:** https://${APP_NAME}.azurewebsites.net/swagger" >> $GITHUB_STEP_SUMMARY
        echo "**Test:** https://${APP_NAME}.azurewebsites.net/api/catalog-items" >> $GITHUB_STEP_SUMMARY