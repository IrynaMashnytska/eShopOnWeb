name: 2 - Deploy Web App East US (with Slot Swap)

on:
  push:
    branches: [ master ]
    paths:
      - 'src/Web/**'
      - 'src/Core/**'
      - 'src/Infrastructure/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/Web/Web.csproj'
  TEST_PATH: 'tests/UnitTests/UnitTests.csproj'

jobs:
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore packages
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: 🏗️ Build
      run: |
        dotnet build ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-restore

    - name: 🧪 Run Tests
      run: |
        dotnet test ${{ env.TEST_PATH }} \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory ./test-results

    - name: 📊 Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()               # Run even if tests fail
      with:
        name: Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: 📤 Publish App
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ./publish

    - name: 💾 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-app-build-${{ github.sha }}
        path: ./publish
        retention-days: 1

  # ───────────────────────────────────────────
  # JOB 2: Deploy to STAGING SLOT
  # ───────────────────────────────────────────
  deploy-staging:
    name: 🔵 Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: build
    environment: staging-eastus   # Uses staging environment

    steps:
    - name: 📥 Download artifact
      uses: actions/download-artifact@v4
      with:
        name: web-app-build-${{ github.sha }}
        path: ./publish

    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Get App Name from Azure
      id: get_app
      run: |
        # Find the web app in East US RG
        APP_NAME=$(az webapp list \
          --resource-group rg-eshop-eus-prod \
          --query "[?contains(name,'web-eshop-eus')].name" \
          --output tsv)

        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
        echo "Found app: $APP_NAME"

    - name: 🚀 Deploy to STAGING slot
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ steps.get_app.outputs.app_name }}
        slot-name: staging                    # ← Deploy to staging!
        package: ./publish

    - name: ⏳ Wait for app to start
      run: |
        echo "Waiting 30 seconds for app to start..."
        sleep 30

    - name: 🔍 Test Staging Slot
      id: test_staging
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        STAGING_URL="https://${APP_NAME}-staging.azurewebsites.net"

        echo "Testing staging: $STAGING_URL"

        # Test up to 5 times
        for i in {1..5}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            --location \
            "$STAGING_URL")

          echo "Attempt $i: Status $STATUS"

          if [[ "$STATUS" == "200" ]] || [[ "$STATUS" == "302" ]]; then
            echo "✅ Staging is healthy!"
            echo "staging_url=$STAGING_URL" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Waiting 15 seconds..."
          sleep 15
        done

        echo "❌ Staging health check failed after 5 attempts"
        exit 1

    - name: 📝 Add Staging URL to Summary
      run: |
        echo "## 🔵 Staging Slot Ready!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** ${{ steps.test_staging.outputs.staging_url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Ready for approval to swap to production" >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────
  # JOB 3: Swap Staging → Production
  # Requires MANUAL APPROVAL in GitHub!
  # ───────────────────────────────────────────
  swap-to-production:
    name: 🔄 Swap to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production-eastus  # ← REQUIRES APPROVAL!

    steps:
    - name: 🔐 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🔍 Get App Name
      id: get_app
      run: |
        APP_NAME=$(az webapp list \
          --resource-group rg-eshop-eus-prod \
          --query "[?contains(name,'web-eshop-eus')].name" \
          --output tsv)
        echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

    - name: 🔄 Swap Staging → Production
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        echo "Swapping staging to production for: $APP_NAME"

        az webapp deployment slot swap \
          --name "$APP_NAME" \
          --resource-group rg-eshop-eus-prod \
          --slot staging \
          --target-slot production

        echo "✅ Swap complete!"

    - name: ⏳ Wait for production to stabilize
      run: sleep 30

    - name: 🔍 Verify Production
      id: verify_prod
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        PROD_URL="https://${APP_NAME}.azurewebsites.net"

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          --max-time 20 \
          --location \
          "$PROD_URL")

        echo "Production status: $STATUS"

        if [[ "$STATUS" == "200" ]] || [[ "$STATUS" == "302" ]]; then
          echo "✅ Production is healthy!"
          echo "prod_url=$PROD_URL" >> $GITHUB_OUTPUT
        else
          echo "❌ Production check failed - rolling back!"
          exit 1
        fi

    - name: ↩️ Rollback if failed
      if: failure()
      run: |
        APP_NAME="${{ steps.get_app.outputs.app_name }}"
        echo "🔴 Production unhealthy - rolling back!"

        az webapp deployment slot swap \
          --name "$APP_NAME" \
          --resource-group rg-eshop-eus-prod \
          --slot staging \
          --target-slot production

        echo "↩️ Rollback complete - previous version restored"

    - name: 📝 Summary
      if: success()
      run: |
        echo "## ✅ Production Deployed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** ${{ steps.verify_prod.outputs.prod_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY